# Nginx 反向代理範例（如果你不想用 Caddy）
#
# 放到 /etc/nginx/sites-available/imgdrop，然後：
#   sudo ln -s /etc/nginx/sites-available/imgdrop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 憑證：sudo apt install -y certbot python3-certbot-nginx
#            sudo certbot --nginx -d photos.example.com
#
# 注意：用了反向代理後，記得把 .env 的 TRUST_PROXY 改成 true，
#       否則限流會把所有訪客當成同一個 IP（127.0.0.1）。

server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com;

    # 要比 .env 的 MAX_FILE_BYTES 大一點
    client_max_body_size 25m;
    client_body_timeout 300s;

    # 不要讓日誌寫滿磁碟
    access_log /var/log/nginx/imgdrop.access.log;
    error_log  /var/log/nginx/imgdrop.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 讓上傳直接串流到 Node，不要在 Nginx 先落地成暫存檔
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
